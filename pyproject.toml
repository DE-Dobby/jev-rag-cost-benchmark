[project]
name = "jev-rag-bench"
version = "0.1.0"
description = "Jev 캐스케이드로 RAG 환각 검증 비용을 줄이는 실험 (RAGTruth 기반)"
requires-python = ">=3.11"
dependencies = [
    "google-cloud-aiplatform>=1.70",
    "google-cloud-storage>=2.18",
    "google-cloud-secret-manager>=2.20",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "tenacity>=9.0",
    "typer>=0.12",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
jev-rag-bench = "jev_rag_bench.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_rag_bench"]
