# 실험 설정. 숫자/모델ID 중 null인 값은 Phase 1~2에서 공식 문서 확인 후 채운다.
# (기억이나 추측으로 채우지 않는다 — 프로젝트 규칙)

seed: 42

dataset:
  source: ragtruth
  raw_dir: data/raw/ragtruth        # cache.backend가 gcs면 gs:// 경로로 전환
  tasks: [QA, Data2txt, Summary]
  label_mapping:
    # 응답 단위 라벨: 환각 span이 하나라도 있으면 1, 없으면 0.
    # 아래 두 플래그는 RAGTruth 라벨 스키마 확인 후(Phase 1) README에도 명시한다.
    implicit_true_as_hallucination: true
    due_to_null_as_hallucination: false
  split:
    use_native_split: true          # RAGTruth에 train/test 구분이 있으면 그대로 사용
    dev_size: 500
    test_size: 500

jev:
  provider: typesafe                # typesafe | openrouter | aimlapi
  model: jev-1.13.0                 # jev-latest 대신 버전 고정 (재현성). docs.typesafe.ai/models, 확인일 2026-10-04
  endpoint: https://api.typesafe.ai/v1/systemone
  prompt_version: v1
  question_variants: [v1, v2, v3]   # 문구 민감도 ablation
  max_input_tokens: 32000           # state + 가장 긴 질문 기준 32K (공식 문서 확인, 전체 요청 한도는 64K)
  overflow_policy: truncate         # truncate | exclude — 선택 시 처리 건수를 결과에 기록

vertex:
  project: null                     # GCP_PROJECT_ID 환경변수로 주입
  region: us-west1                  # Jev 서비스가 미국 서부로 알려져 지연시간 비교를 위해 우선 검토.
                                     # cloud.google.com/vertex-ai/generative-ai/docs/learn/locations (확인일 2026-10-04)에서
                                     # gemini-2.5-pro/flash 둘 다 us-west1(Oregon) 서빙 확인됨
  models:
    primary: gemini-2.5-pro         # 기준 A / 캐스케이드 B 폴백. 3.x Pro는 아직 Preview뿐이라 GA인 2.5 사용
    cheap: gemini-2.5-flash         # 저가형 대조군 C. primary와 같은 세대로 맞춰 세대효과 혼입 방지
  thinking_budget: 128              # A/폴백/C 전부 동일 고정값. Gemini 2.5 Pro는 thinking을 끌 수 없음
                                     # (공식 문서 확인: 2.5 Pro min=128/max=32768, 2.5 Flash는 0 가능/max=24576).
                                     # 그래서 "끄거나 같은 예산" 중 "같은 예산"을 택함 — 둘 다 유효한 Pro의 최솟값 128로 통일.
                                     # 출처: cloud.google.com/vertex-ai/generative-ai/docs/thinking, 확인일 2026-10-04
  response_schema:
    type: object
    properties:
      hallucinated:
        type: boolean
    required: [hallucinated]

cascade:
  thresholds: [0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95, 0.99]
  fallback_model: vertex.primary    # 캐스케이드 B의 폴백 = 기준 A와 동일 모델

budget:
  max_usd: 5.0                      # CLI --max-usd 로 오버라이드 가능. 초과 시 즉시 중단
  stop_on_exceed: true

cache:
  backend: local                    # local만 구현됨. gcs(Cloud Run Job용)는 설계만 해두고 아직 미구현
  local_dir: results/cache
  key_fields: [provider, model, prompt_version, sample_id]

concurrency:
  max_parallel: 4
  retry:
    max_attempts: 5
    backoff_base_sec: 2             # 지수 백오프 (429 대응)
